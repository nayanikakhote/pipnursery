<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pip's Midnight Nursery</title>
    <meta name="description" content="The portfolio of Pip, Junior Dream Engineer at the Midnight Nursery. Explore Pip's room, boot up DreamOS, and play with Pip's lullabies, nightlights and dream maps." />
    <meta name="theme-color" content="#30364E" />
    <!-- Social cards need absolute URLs: a crawler has no page context to
         resolve "/og.png" against. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pipnursery.vercel.app/" />
    <meta property="og:title" content="Pip's Midnight Nursery" />
    <meta property="og:description" content="I build the dreams you fall asleep inside. — Pip" />
    <meta property="og:image" content="https://pipnursery.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pip, a baby with a round skull face in a starry nightcap, sitting on a cloud under a crescent moon." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pip's Midnight Nursery" />
    <meta name="twitter:description" content="I build the dreams you fall asleep inside. — Pip" />
    <meta name="twitter:image" content="https://pipnursery.vercel.app/og.png" />
    <!-- Icons are built from art-raw/favicon.png by tools/make_favicons.py.
         Vite rewrites these root-relative paths with the configured base, so
         they keep working from a sub-path. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Fredoka:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Pip's room needs JavaScript to wake up. ✨</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
